<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReaderA Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>ReaderA</h2>
      <p class="subtitle">Local AI Chart Simplifier</p>
    </header>
    
    <main>
      <div id="status-box" class="status-box">Initializing local AI model... Please wait.</div>
      
      <div class="priority-container">
        <label for="priority-select">Analysis Focus / Priority:</label>
        <select id="priority-select">
          <option value="executive">Executive Summary (Concise overview)</option>
          <option value="trends">Key Trends & Insights (Focus on direction)</option>
          <option value="data">Data Extraction (Focus on exact numbers/values)</option>
          <option value="anomalies">Anomalies & Outliers (Focus on unusual points)</option>
        </select>
      </div>

      <button id="select-btn" class="primary-btn" disabled>Select Chart on Page</button>
      
      <div id="result-container" class="hidden">
        <h3>Summary</h3>
        <p id="summary-text">Waiting for chart analysis...</p>
      </div>
    </main>
  </div>
  
  <script type="module" src="Logic.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
